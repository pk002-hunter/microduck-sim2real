name: microduck-gcs
services:
  microduck-gcs:
    image: python:3.11-slim
    container_name: microduck_gcs
    restart: unless-stopped
    command: >
      bash -c "apt-get update && apt-get install -y git curl &&
               git clone https://github.com/pk002-hunter/microduck-sim2real.git /app &&
               cd /app && pip install -r requirements.txt &&
               python telemetry_server.py & python app.py"
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - HOME_SERVER_URL=http://localhost:8001
    network_mode: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  main: microduck-gcs
  description:
    en_us: "Sim-to-Real Bipedal Locomotion Ground Control Station & Edge Telemetry Logger for Microduck robot"
  tagline:
    en_us: "MicroDuck Robotics GCS (SCS-701 Seminar)"
  developer: "Piyush Karnatak"
  author: "Piyush Karnatak"
  icon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/robot.png"
  title:
    en_us: "MicroDuck GCS"
  index: /
  port_map: "8000"
